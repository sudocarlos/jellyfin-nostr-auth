framework: "net10.0"
owner: "geru"
image: "icon.png"
overview: "Nostr login for Jellyfin"
description: >
  Replaces username/password login with Nostr authentication for the web
  client. Viewers log in with a NIP-98 signed event (NIP-07 extension,
  NIP-46 bunker, or Amber), and access is authorized by the server owner's
  private Nostr allowlist. The plugin holds no owner-identity key material;
  the list keypair is dedicated and trivially rotatable.
category: "General"
